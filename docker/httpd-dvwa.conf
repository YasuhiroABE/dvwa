# Apache configuration for DVWA on Alpine Linux.
# This file replaces /etc/apache2/conf.d/mod_fcgid.conf in the container image.
# PHP scripts are executed by php-cgi (from the php:*-alpine image) via mod_fcgid.

LoadModule fcgid_module modules/mod_fcgid.so

ServerName localhost

<IfModule fcgid_module>
    FcgidIPCDir /run/apache2/fcgid
    FcgidProcessTableFile /run/apache2/fcgid_shm
    # Keep php-cgi processes recycled before PHP_FCGI_MAX_REQUESTS (default 500) is reached.
    FcgidMaxRequestsPerProcess 500
    # Allow request bodies large enough for the file upload exercise (default is only 128KB).
    FcgidMaxRequestLen 16777216
    FcgidIOTimeout 60
</IfModule>

DirectoryIndex index.php index.html

<Directory "/var/www/html">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride None
    Require all granted

    AddHandler fcgid-script .php
    FcgidWrapper /usr/local/bin/php-cgi .php
</Directory>
